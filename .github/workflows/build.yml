name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare environment variables & keystore
        run: |
          chmod +x gradlew || true
          touch .env
          echo "GEMINI_API_KEY=" > .env
          touch .env.example
          echo "GEMINI_API_KEY=" > .env.example
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Accept Android SDK Licenses & Install SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.3.0
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.13 || true
          chmod +x gradlew || true
          gradle :app:assembleDebug -x test -x lint --no-daemon --stacktrace
          echo "Listing generated APK files:"
          find app/build/outputs/apk/debug/ -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error






name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O /tmp/gradle-8.13.zip
          sudo unzip -q /tmp/gradle-8.13.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> $GITHUB_PATH

      - name: Prepare build environment
        run: |
          touch .env
          echo "GEMINI_API_KEY=" > .env
          touch .env.example
          echo "GEMINI_API_KEY=" > .env.example
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK with Gradle
        run: |
          gradle --version
          gradle :app:assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Locate and verify APK
        run: |
          echo "Listing generated APK files:"
          find app/build/outputs/ -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/**/*.apk
          if-no-files-found: error






